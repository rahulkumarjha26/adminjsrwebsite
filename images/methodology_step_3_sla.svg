<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <defs>
        <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="30" />
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Deep Tech Background -->
    <rect width="600" height="400" fill="#060713" />
    
    <!-- Animated Grid Lines -->
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
        <line x1="100" y1="0" x2="100" y2="400" />
        <line x1="200" y1="0" x2="200" y2="400" />
        <line x1="300" y1="0" x2="300" y2="400" />
        <line x1="400" y1="0" x2="400" y2="400" />
        <line x1="500" y1="0" x2="500" y2="400" />
        <line x1="0" y1="100" x2="600" y2="100" />
        <line x1="0" y1="200" x2="600" y2="200" />
        <line x1="0" y1="300" x2="600" y2="300" />
    </g>

    <!-- Glowing Background Blobs -->
    <circle cx="200" cy="180" r="100" fill="url(#glowPurple)" filter="url(#blur)" />
    <circle cx="420" cy="220" r="90" fill="url(#glowCyan)" filter="url(#blur)" />

    <!-- Technical UI Accents -->
    <circle cx="300" cy="200" r="170" fill="none" stroke="rgba(99, 102, 241, 0.1)" stroke-width="1.5" stroke-dasharray="10 15" />
    <circle cx="300" cy="200" r="150" fill="none" stroke="rgba(34, 211, 238, 0.08)" stroke-width="1" />

    <!-- SLA Document (Glassmorphism Card) -->
    <g transform="translate(180, 100)">
        <rect x="0" y="0" width="240" height="200" rx="16" fill="rgba(15, 17, 34, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
        <rect x="0" y="0" width="240" height="200" rx="16" fill="none" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4" />
        
        <!-- Document Header Lines -->
        <rect x="25" y="30" width="100" height="10" rx="3" fill="#6366f1" opacity="0.8" />
        <rect x="25" y="50" width="60" height="6" rx="2" fill="#22d3ee" opacity="0.6" />
        
        <!-- Document Body Lines -->
        <rect x="25" y="80" width="190" height="4" rx="2" fill="rgba(255,255,255,0.2)" />
        <rect x="25" y="95" width="190" height="4" rx="2" fill="rgba(255,255,255,0.2)" />
        <rect x="25" y="110" width="140" height="4" rx="2" fill="rgba(255,255,255,0.2)" />
        
        <!-- Dynamic Metric Ring inside Document -->
        <circle cx="175" cy="45" r="20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4" />
        <circle cx="175" cy="45" r="20" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="90 120" filter="url(#glow)" />
        <text x="175" y="49" fill="#22d3ee" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" text-anchor="middle">99%</text>

        <!-- Compliance Check List items -->
        <g transform="translate(25, 135)">
            <circle cx="10" cy="10" r="8" fill="rgba(34, 211, 238, 0.1)" stroke="#22d3ee" stroke-width="1" />
            <path d="M7 10 l2 2 l4 -4" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" />
            <text x="25" y="14" fill="rgba(255,255,255,0.6)" font-family="'Manrope', sans-serif" font-size="11">Response Time SLA</text>
        </g>
        
        <g transform="translate(25, 160)">
            <circle cx="10" cy="10" r="8" fill="rgba(99, 102, 241, 0.1)" stroke="#6366f1" stroke-width="1" />
            <path d="M7 10 l2 2 l4 -4" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" />
            <text x="25" y="14" fill="rgba(255,255,255,0.6)" font-family="'Manrope', sans-serif" font-size="11">Accuracy Guarantee</text>
        </g>
    </g>

    <!-- Clock / Watchdog Timer Overlay -->
    <g transform="translate(390, 240)" filter="url(#glow)">
        <circle cx="35" cy="35" r="35" fill="#0f1122" stroke="#22d3ee" stroke-width="2" />
        <circle cx="35" cy="35" r="30" fill="none" stroke="rgba(34, 211, 238, 0.2)" stroke-width="1" stroke-dasharray="4 4" />
        <!-- Clock Hands -->
        <line x1="35" y1="35" x2="35" y2="18" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
        <line x1="35" y1="35" x2="50" y2="35" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
        <circle cx="35" cy="35" r="3" fill="#fff" />
    </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <defs>
        <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#eab308" />
        </linearGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="30" />
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Deep Tech Background -->
    <rect width="600" height="400" fill="#060713" />
    
    <!-- Grid -->
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
        <line x1="100" y1="0" x2="100" y2="400" />
        <line x1="200" y1="0" x2="200" y2="400" />
        <line x1="300" y1="0" x2="300" y2="400" />
        <line x1="400" y1="0" x2="400" y2="400" />
        <line x1="500" y1="0" x2="500" y2="400" />
        <line x1="0" y1="100" x2="600" y2="100" />
        <line x1="0" y1="200" x2="600" y2="200" />
        <line x1="0" y1="300" x2="600" y2="300" />
    </g>

    <!-- Glowing Background Blobs -->
    <circle cx="200" cy="220" r="100" fill="url(#glowBlue)" filter="url(#blur)" />
    <circle cx="400" cy="180" r="95" fill="url(#glowGold)" filter="url(#blur)" />

    <!-- PM Sign-off Panel (Glassmorphism) -->
    <g transform="translate(150, 100)">
        <rect x="0" y="0" width="300" height="200" rx="16" fill="rgba(15, 17, 34, 0.65)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
        <rect x="0" y="0" width="300" height="200" rx="16" fill="none" stroke="url(#stampGrad)" stroke-width="1" opacity="0.4" />
        
        <!-- Project Summary Lines -->
        <g transform="translate(25, 30)">
            <rect x="0" y="0" width="80" height="10" rx="3" fill="#3b82f6" opacity="0.8" />
            <rect x="0" y="18" width="160" height="4" rx="2" fill="rgba(255,255,255,0.4)" />
            <rect x="0" y="28" width="120" height="4" rx="2" fill="rgba(255,255,255,0.4)" />
            
            <rect x="0" y="50" width="250" height="1" fill="rgba(255,255,255,0.1)" />
            
            <!-- Delivery Status -->
            <rect x="0" y="65" width="90" height="18" rx="4" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
            <text x="45" y="77" fill="#3b82f6" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" text-anchor="middle">DELIVERED</text>
            
            <rect x="105" y="65" width="90" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
            <text x="150" y="77" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" text-anchor="middle">SLA PASSED</text>
        </g>
        
        <!-- Signature Area -->
        <g transform="translate(25, 140)">
            <text x="0" y="10" fill="rgba(255,255,255,0.3)" font-family="'Manrope', sans-serif" font-size="9">AUTHORIZED PM SIGN-OFF</text>
            <line x1="0" y1="35" x2="160" y2="35" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            
            <!-- Digital Signature Path -->
            <path d="M 10 30 Q 30 10 40 32 T 70 20 T 100 25 T 140 18" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
        </g>

        <!-- PM Approval Stamp Badge -->
        <g transform="translate(200, 110)" filter="url(#glow)">
            <circle cx="40" cy="40" r="35" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" />
            <circle cx="40" cy="40" r="31" fill="none" stroke="#f59e0b" stroke-width="1.5" />
            <text x="40" y="38" fill="#f59e0b" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.05em">APPROVED</text>
            <text x="40" y="48" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="7" font-weight="600" text-anchor="middle">SIGN-OFF</text>
            <!-- Checkmark inside Stamp -->
            <path d="M 33 22 l 5 5 l 10 -10" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
        </g>
    </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <defs>
        <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="glowIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="30" />
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Deep Tech Background -->
    <rect width="600" height="400" fill="#060713" />
    
    <!-- Grid -->
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
        <line x1="100" y1="0" x2="100" y2="400" />
        <line x1="200" y1="0" x2="200" y2="400" />
        <line x1="300" y1="0" x2="300" y2="400" />
        <line x1="400" y1="0" x2="400" y2="400" />
        <line x1="500" y1="0" x2="500" y2="400" />
        <line x1="0" y1="100" x2="600" y2="100" />
        <line x1="0" y1="200" x2="600" y2="200" />
        <line x1="0" y1="300" x2="600" y2="300" />
    </g>

    <!-- Glowing Background Blobs -->
    <circle cx="200" cy="180" r="100" fill="url(#glowGold)" filter="url(#blur)" />
    <circle cx="400" cy="220" r="95" fill="url(#glowIndigo)" filter="url(#blur)" />

    <!-- Domain Expert Dashboard (Glassmorphism Card) -->
    <g transform="translate(150, 95)">
        <rect x="0" y="0" width="300" height="210" rx="16" fill="rgba(15, 17, 34, 0.65)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
        <rect x="0" y="0" width="300" height="210" rx="16" fill="none" stroke="url(#cardGrad)" stroke-width="1" opacity="0.35" />
        
        <!-- Central Medal / Expert Badge -->
        <g transform="translate(40, 45)" filter="url(#glow)">
            <circle cx="35" cy="35" r="30" fill="none" stroke="#fbbf24" stroke-width="2" />
            <circle cx="35" cy="35" r="26" fill="rgba(251, 191, 36, 0.1)" />
            <!-- Star inside Medal -->
            <path d="M 35 18 L 39 28 L 50 28 L 41 34 L 44 45 L 35 38 L 26 45 L 29 34 L 20 28 L 31 28 Z" fill="#fbbf24" />
        </g>
        
        <!-- Industry Badges (Legal, Medical, IT) -->
        <g transform="translate(130, 35)">
            <text x="0" y="10" fill="#fff" font-family="'Manrope', sans-serif" font-size="12" font-weight="700">Subject Matter Experts</text>
            <text x="0" y="24" fill="rgba(255,255,255,0.4)" font-family="'Manrope', sans-serif" font-size="9">Matched to your project vertical</text>
        </g>

        <!-- Vertical selection list -->
        <g transform="translate(130, 80)">
            <g transform="translate(0, 0)">
                <rect x="0" y="0" width="140" height="22" rx="4" fill="rgba(251, 191, 36, 0.08)" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1" />
                <circle cx="12" cy="11" r="4" fill="#fbbf24" />
                <text x="25" y="14" fill="rgba(255,255,255,0.8)" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">LEGAL &amp; PATENT</text>
            </g>
            <g transform="translate(0, 30)">
                <rect x="0" y="0" width="140" height="22" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
                <circle cx="12" cy="11" r="4" fill="rgba(255,255,255,0.2)" />
                <text x="25" y="14" fill="rgba(255,255,255,0.6)" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">MEDICAL &amp; CLINICAL</text>
            </g>
            <g transform="translate(0, 60)">
                <rect x="0" y="0" width="140" height="22" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
                <circle cx="12" cy="11" r="4" fill="rgba(255,255,255,0.2)" />
                <text x="25" y="14" fill="rgba(255,255,255,0.6)" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">IT &amp; SOFTWARE</text>
            </g>
        </g>
    </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <defs>
        <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#7e22ce" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="30" />
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Deep Tech Background -->
    <rect width="600" height="400" fill="#060713" />
    
    <!-- Grid -->
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
        <line x1="100" y1="0" x2="100" y2="400" />
        <line x1="200" y1="0" x2="200" y2="400" />
        <line x1="300" y1="0" x2="300" y2="400" />
        <line x1="400" y1="0" x2="400" y2="400" />
        <line x1="500" y1="0" x2="500" y2="400" />
        <line x1="0" y1="100" x2="600" y2="100" />
        <line x1="0" y1="200" x2="600" y2="200" />
        <line x1="0" y1="300" x2="600" y2="300" />
    </g>

    <!-- Glowing Background Blobs -->
    <circle cx="250" cy="180" r="100" fill="url(#glowPurple)" filter="url(#blur)" />
    <circle cx="350" cy="220" r="95" fill="url(#glowViolet)" filter="url(#blur)" />

    <!-- PM Assigned Dashboard (Glassmorphism Card) -->
    <g transform="translate(150, 95)">
        <rect x="0" y="0" width="300" height="210" rx="16" fill="rgba(15, 17, 34, 0.65)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
        <rect x="0" y="0" width="300" height="210" rx="16" fill="none" stroke="url(#cardGrad)" stroke-width="1" opacity="0.35" />
        
        <!-- User Avatar / PM Representation -->
        <g transform="translate(30, 30)">
            <circle cx="30" cy="30" r="30" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.5" />
            <!-- Head & shoulders -->
            <circle cx="30" cy="22" r="10" fill="#a855f7" />
            <path d="M12 48 C12 38 20 38 30 38 C40 38 48 38 48 48 Z" fill="#a855f7" />
            <circle cx="48" cy="45" r="7" fill="#8b5cf6" filter="url(#glow)" />
            <path d="M45 45 l2 2 l4 -4" fill="none" stroke="#fff" stroke-width="1.5" />
        </g>
        
        <g transform="translate(110, 35)">
            <text x="0" y="10" fill="#fff" font-family="'Manrope', sans-serif" font-size="12" font-weight="700">Project Manager Assigned</text>
            <text x="0" y="24" fill="rgba(255,255,255,0.4)" font-family="'Manrope', sans-serif" font-size="9">Dedicated single point of contact</text>
        </g>

        <!-- Project Schedule & Timeline -->
        <g transform="translate(30, 110)">
            <rect x="0" y="0" width="240" height="75" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
            
            <!-- Timeline checkpoints -->
            <circle cx="30" cy="38" r="5" fill="#a855f7" filter="url(#glow)" />
            <line x1="35" y1="38" x2="115" y2="38" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
            
            <circle cx="120" cy="38" r="5" fill="#8b5cf6" />
            <line x1="125" y1="38" x2="205" y2="38" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
            
            <circle cx="210" cy="38" r="5" fill="rgba(255,255,255,0.2)" />
            
            <text x="30" y="22" fill="rgba(255,255,255,0.6)" font-family="'Manrope', sans-serif" font-size="8" text-anchor="middle">Allocation</text>
            <text x="120" y="22" fill="rgba(255,255,255,0.6)" font-family="'Manrope', sans-serif" font-size="8" text-anchor="middle">Execution</text>
            <text x="210" y="22" fill="rgba(255,255,255,0.6)" font-family="'Manrope', sans-serif" font-size="8" text-anchor="middle">Delivery</text>

            <rect x="20" y="55" width="200" height="4" rx="2" fill="rgba(168, 85, 247, 0.2)" />
            <rect x="20" y="55" width="110" height="4" rx="2" fill="#a855f7" />
        </g>
    </g>
</svg>
